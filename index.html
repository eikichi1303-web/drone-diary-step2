<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172B49">
  <title>DER FLIGHT LOG｜機体管理（確認用）</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">DER FLIGHT LOG</div>
    <div class="env">STEP2 確認用｜機体管理</div>
  </header>

  <main class="container">
    <section class="notice">
      <strong>独立確認ページ</strong>
      <p>このページはホーム画面とは接続していません。直接アドレスを開いて機体管理を確認します。</p>
      <p>
        <a href="./pilots.html">操縦者管理の確認ページへ</a>
        ｜
        <a href="./flights.html">飛行記録の確認ページへ</a>
      </p>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h1>機体管理</h1>
        <button id="newAircraftButton" class="primary">＋ 機体を登録</button>
      </div>
      <p id="dbStatus" class="muted" role="status">データベースを確認しています…</p>
      <div id="aircraftList" class="list"></div>
      <p id="emptyMessage" class="empty" hidden>登録されている機体はありません。</p>
    </section>

    <section id="editorPanel" class="panel" hidden>
      <div class="section-heading">
        <h2 id="editorTitle">機体を登録</h2>
        <button id="closeEditorButton" class="subtle">閉じる</button>
      </div>

      <form id="aircraftForm">
        <input type="hidden" id="aircraftId">

        <div class="form-grid">
          <label>機体名・呼称 <span class="required">必須</span>
            <input id="name" type="text" required maxlength="120">
          </label>
          <label>登録記号 <span class="required">必須</span>
            <input id="registrationMark" type="text" required maxlength="120">
          </label>
          <label>種類
            <input id="aircraftType" type="text" maxlength="120">
          </label>
          <label>型式
            <input id="model" type="text" maxlength="120">
            <small>型式認証を受けた機体は入力してください。</small>
          </label>
          <label>型式認証書番号
            <input id="typeCertificationNumber" type="text" maxlength="120">
            <small>型式認証を受けた機体は入力してください。</small>
          </label>
          <label>機体認証
            <select id="hasAircraftCertification" required>
              <option value="">選択してください</option>
              <option value="true">あり</option>
              <option value="false">なし</option>
            </select>
          </label>
        </div>

        <div id="aircraftCertificationFields" class="conditional-box" hidden>
          <h3>機体認証の情報</h3>
          <p class="muted">機体認証が「あり」の場合に入力してください。</p>
          <div class="form-grid">
            <label>機体認証の区分 <span class="required">必須</span>
              <input id="aircraftCertificationClass" type="text" maxlength="120">
            </label>
            <label>機体認証書番号 <span class="required">必須</span>
              <input id="aircraftCertificationNumber" type="text" maxlength="120">
            </label>
          </div>
        </div>

        <div class="form-grid">
          <label>設計製造者 <span class="required">必須</span>
            <input id="manufacturer" type="text" required maxlength="120">
          </label>
          <label>製造番号 <span class="required">必須</span>
            <input id="serialNumber" type="text" required maxlength="120">
          </label>
          <label>リモートID型式
            <input id="remoteIdType" type="text" maxlength="120">
          </label>
          <fieldset class="hours-field">
            <legend>登録時点の総飛行時間 <span class="required">必須</span></legend>
            <div class="hours-inputs">
              <label>時間
                <input id="totalHours" type="number" min="0" step="1" value="0" required>
              </label>
              <label>分
                <input id="totalMinutes" type="number" min="0" max="59" step="1" value="0" required>
              </label>
            </div>
            <small>0時間0分で登録できます。</small>
          </fieldset>
          <label>使用状態
            <select id="status" required>
              <option value="使用中">使用中</option>
              <option value="使用停止">使用停止</option>
            </select>
          </label>
        </div>

        <label class="full-width">備考
          <textarea id="notes" rows="3" maxlength="2000"></textarea>
        </label>

        <label id="editReasonWrap" class="full-width" hidden>編集理由（任意）
          <input id="editReason" type="text" maxlength="500">
        </label>

        <div class="actions">
          <button type="submit" class="primary">保存する</button>
          <button type="button" id="cancelEditButton" class="subtle">キャンセル</button>
        </div>
        <p id="formMessage" class="form-message" role="alert"></p>
      </form>
    </section>
  </main>

  <footer>DER FLIGHT LOG｜STEP2 確認用</footer>
  <script type="module" src="./aircraft.js"></script>
</body>
</html>
